apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: labboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vedanshun05/devops-heros.git
    targetRevision: session21-python
    path: session21-python/helm/taskboard
    helm:
      releaseName: taskboard
      valueFiles: [values.yaml, ../../gitops/values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: taskboard
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: taskboard-taskboard-backend
      jsonPointers: [/spec/replicas]
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true]
