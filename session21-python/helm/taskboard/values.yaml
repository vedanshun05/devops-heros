frontend:
  image: ghcr.io/vedanshun05/labboard-frontend
  tag: latest
backend:
  image: ghcr.io/vedanshun05/labboard-backend
  tag: latest
replicaCount: 2
namespace: taskboard
imagePullSecrets: []
postgres:
  host: taskboard-postgres
  database: taskboard
  username: taskboard
  password: ""
  existingSecret: true
ingress:
  enabled: false
  host: taskboard.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
monitoring:
  serviceMonitor:
    enabled: false
