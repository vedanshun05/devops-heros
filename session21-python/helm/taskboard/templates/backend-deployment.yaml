apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.fullname" . }}-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: taskboard-backend}
  template:
    metadata:
      labels: {app: taskboard-backend}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      initContainers:
        - name: migrations
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          command: ["sh", "-c", "until alembic upgrade head; do sleep 3; done"]
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: taskboard-postgres, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: taskboard-postgres, key: password}}
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@{{ .Values.postgres.host }}:5432/{{ .Values.postgres.database }}"
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: taskboard-config}
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: taskboard-postgres, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: taskboard-postgres, key: password}}
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@{{ .Values.postgres.host }}:5432/{{ .Values.postgres.database }}"
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
{{ toYaml .Values.resources | indent 12 }}
