name: Session 21 LabBoard CI/CD and DevSecOps
on:
  push:
    branches: [session21-python]
    paths:
      - 'session21-python/backend/**'
      - 'session21-python/frontend/**'
      - 'session21-python/helm/**'
      - 'session21-python/docker-compose.yml'
      - '.github/workflows/session21-ci-cd.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  APP_DIR: session21-python
  BACKEND_IMAGE: ghcr.io/vedanshun05/labboard-backend
  FRONTEND_IMAGE: ghcr.io/vedanshun05/labboard-frontend
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install locked backend dependencies
        run: pip install -r "$APP_DIR/backend/requirements.txt"
      - name: Ten isolated API tests
        working-directory: session21-python/backend
        run: pytest -v
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build locked frontend
        working-directory: session21-python/frontend
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: labboard-frontend-build
          path: session21-python/frontend/dist
  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: SAST gate
        run: |
          pip install bandit pip-audit
          bandit -r "$APP_DIR/backend/app" --severity-level medium --confidence-level medium
      - name: Python SCA gate
        run: pip-audit -r "$APP_DIR/backend/requirements.txt"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Frontend SCA gate
        working-directory: session21-python/frontend
        run: npm ci --ignore-scripts && npm audit --audit-level=high
      - name: Secret scanning gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: session21-python
          scanners: secret
          exit-code: '1'
  images:
    needs: security
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - name: Build both images with commit-SHA tags
        run: |
          docker build --pull -t "$BACKEND_IMAGE:$GITHUB_SHA" "$APP_DIR/backend"
          docker build --pull -t "$FRONTEND_IMAGE:$GITHUB_SHA" "$APP_DIR/frontend"
      - name: Backend HIGH and CRITICAL security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/vedanshun05/labboard-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Frontend HIGH and CRITICAL security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/vedanshun05/labboard-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish gated images
        run: |
          docker push "$BACKEND_IMAGE:$GITHUB_SHA"
          docker push "$FRONTEND_IMAGE:$GITHUB_SHA"
  deploy:
    needs: images
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact published images
        run: |
          docker pull "$BACKEND_IMAGE:$GITHUB_SHA"
          docker pull "$FRONTEND_IMAGE:$GITHUB_SHA"
      - uses: helm/kind-action@v1
        with: {cluster_name: labboard, wait: 120s}
      - name: Load published images into deployment cluster
        run: |
          kind load docker-image "$BACKEND_IMAGE:$GITHUB_SHA" --name labboard
          kind load docker-image "$FRONTEND_IMAGE:$GITHUB_SHA" --name labboard
      - name: Helm deploy with runtime-only database secret
        run: |
          kubectl apply -f "$APP_DIR/k8s/namespace.yaml"
          PASSWORD=$(openssl rand -hex 24)
          kubectl create secret generic taskboard-postgres -n taskboard \
            --from-literal=username=taskboard --from-literal=password="$PASSWORD"
          helm upgrade --install taskboard "$APP_DIR/helm/taskboard" -n taskboard \
            --set backend.image="$BACKEND_IMAGE" --set backend.tag="$GITHUB_SHA" \
            --set frontend.image="$FRONTEND_IMAGE" --set frontend.tag="$GITHUB_SHA" \
            --set hpa.enabled=false --wait --timeout 5m
          kubectl get deployments,statefulsets,pods,svc,pvc,configmap -n taskboard
          helm list -n taskboard
      - name: Verify frontend proxy, health and persistent task API
        run: |
          kubectl port-forward -n taskboard service/taskboard-frontend 18000:80 > /tmp/port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://localhost:18000/health
          curl --fail http://localhost:18000/api/tasks/stats
          curl --fail -X POST http://localhost:18000/api/tasks \
            -H 'Content-Type: application/json' \
            -d '{"title":"Verified GitHub Actions deployment","assignee":"Vedanshu","priority":"HIGH"}'
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n taskboard -o wide
          kubectl describe pods -n taskboard
          kubectl get events -n taskboard --sort-by=.lastTimestamp
  gitops:
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: session21-python}
      - name: Publish desired image versions to GitOps
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          p = Path("session21-python/gitops/values.yaml")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text("backend:\n  image: " + os.environ["BACKEND_IMAGE"] + "\n  tag: " + os.environ["GITHUB_SHA"] + "\nfrontend:\n  image: " + os.environ["FRONTEND_IMAGE"] + "\n  tag: " + os.environ["GITHUB_SHA"] + "\nreplicaCount: 2\ningress:\n  enabled: true\n  host: labboard.local\nhpa:\n  enabled: true\n")
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add session21-python/gitops/values.yaml
          git diff --cached --quiet || git commit -m 'session21 promote verified images to GitOps'
          git push origin HEAD:session21-python
