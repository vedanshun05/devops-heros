name: Session 16 CI and CD
on:
  push:
    branches: [session16-github-actions]
  workflow_dispatch:
permissions:
  contents: read
env:
  APP_DIR: session-16-github-actions/session-16-github-actions/10-final-cicd-pipeline
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runner details
        run: |
          uname -a
          python --version
      - name: Check demo secret without printing it
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          test -n "$DEMO_SECRET"
          echo 'Demo secret is configured.'
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: python -m pip install -r requirements.txt
      - name: Test
        working-directory: ${{ env.APP_DIR }}
        run: python -m pytest -v
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: bash build.sh
      - name: Build Docker image and package it
        run: |
          docker build -t session16-calculator:${{ github.sha }} "$APP_DIR"
          docker run --rm session16-calculator:${{ github.sha }}
          docker save session16-calculator:${{ github.sha }} | gzip > calculator-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: ${{ env.APP_DIR }}/build/
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-image
          path: calculator-image.tar.gz
  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: calculator-image
      - uses: helm/kind-action@v1
        with:
          cluster_name: session16
          wait: 120s
      - name: Deploy built application to Kubernetes
        run: |
          gunzip calculator-image.tar.gz
          docker load -i calculator-image.tar
          kind load docker-image session16-calculator:${{ github.sha }} --name session16
          kubectl create job calculator-demo --image=session16-calculator:${{ github.sha }}
          kubectl wait --for=condition=complete job/calculator-demo --timeout=120s
          kubectl get jobs,pods
          kubectl logs job/calculator-demo
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe job calculator-demo
          kubectl get events --sort-by=.lastTimestamp
