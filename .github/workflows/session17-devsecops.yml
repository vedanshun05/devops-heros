name: Session 17 DevSecOps
on:
  push:
    branches: [session17-devsecops]
  workflow_dispatch:
permissions:
  contents: read
env:
  APP_DIR: session-17-devsecops/demo
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build application and run unit tests
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install -r requirements-dev.txt
          python -m compileall -q app
          python -m pytest -v --cov=app
  sast:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SAST security gate
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install bandit
          bandit -r app --severity-level medium --confidence-level medium
  sca:
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SCA security gate
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
  secrets:
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scanning security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_DIR }}
          scanners: secret
          exit-code: '1'
  container:
    needs: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER/session17-python:${{ github.sha }}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build --pull -t "$IMAGE" "$APP_DIR"
      - name: Container vulnerability security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Security gates passed
        run: echo 'Tests, SAST, SCA, secret scan and image scan passed. Image may be pushed.'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push gated image
        run: docker push "$IMAGE"
  deploy:
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: session17
          wait: 120s
      - name: Deploy the published image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/session17-python:${{ github.sha }}"
          kubectl create namespace session17
          kubectl create secret docker-registry ghcr-pull -n session17 \
            --docker-server=ghcr.io --docker-username='${{ github.actor }}' \
            --docker-password="$REGISTRY_TOKEN"
          cp "$APP_DIR/k8s/deployment.yaml" /tmp/deployment.yaml
          sed -i "s|nensiravaliya28/hey-cicd:__IMAGE_TAG__|$IMAGE|g" /tmp/deployment.yaml
          kubectl apply -n session17 -f /tmp/deployment.yaml
          kubectl patch deployment session17-python -n session17 --type=merge \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ghcr-pull"}]}}}}'
          kubectl apply -n session17 -f "$APP_DIR/k8s/service.yaml"
          kubectl rollout status deployment/session17-python -n session17 --timeout=180s
          kubectl get deployment,pods,svc -n session17
          kubectl port-forward -n session17 service/session17-python 5001:80 > /tmp/port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://localhost:5001/health
          curl --fail http://localhost:5001/api/status
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n session17 -o wide
          kubectl describe pods -n session17
          kubectl get events -n session17 --sort-by=.lastTimestamp
